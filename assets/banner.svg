<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="Aung Myint Oo (AMO) - AI and robotics engineer in Singapore building perception, agents, and learning systems that compound over time">
  <defs>
    <linearGradient id="ember" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f97316" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f97316"/>
      <stop offset="1" stop-color="#fdba74" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" rx="16" fill="#0a0a0a"/>
  <rect x="1" y="1" width="1198" height="298" rx="15" fill="none" stroke="#27272a" stroke-width="2"/>
  <circle cx="1020" cy="80" r="240" fill="url(#glow)"/>

  <!-- ember streams -->
  <g stroke="url(#ember)" stroke-width="2" fill="none">
    <path d="M660 268 C 820 250, 880 150, 1170 108" stroke-dasharray="5 15" opacity="0.9">
      <animate attributeName="stroke-dashoffset" from="240" to="0" dur="7s" repeatCount="indefinite"/>
    </path>
    <path d="M700 282 C 860 274, 940 190, 1170 160" stroke-dasharray="4 16" opacity="0.6">
      <animate attributeName="stroke-dashoffset" from="240" to="0" dur="9s" repeatCount="indefinite"/>
    </path>
    <path d="M760 292 C 900 290, 1000 230, 1175 212" stroke-dasharray="3 17" opacity="0.4">
      <animate attributeName="stroke-dashoffset" from="240" to="0" dur="11s" repeatCount="indefinite"/>
    </path>
    <path d="M620 250 C 780 220, 850 96, 1170 60" stroke-dasharray="6 14" opacity="0.5">
      <animate attributeName="stroke-dashoffset" from="240" to="0" dur="8s" repeatCount="indefinite"/>
    </path>
  </g>
  <g fill="#f97316">
    <circle cx="1015" cy="122" r="3" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="905" cy="180" r="2.5" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1105" cy="86" r="2" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="1.9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- status pill -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
    <rect x="58" y="50" rx="14" width="352" height="28" fill="none" stroke="#3f3f46"/>
    <circle cx="80" cy="64" r="4" fill="#f97316">
      <animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="94" y="69" fill="#a1a1aa" letter-spacing="2">SINGAPORE · OPEN TO FOUNDING ROLES</text>
  </g>

  <text x="56" y="150" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="56" font-weight="700" fill="#fafafa">Aung Myint Oo <tspan fill="#f97316">· AMO</tspan></text>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21" fill="#a1a1aa">
    <text x="58" y="194">AI &amp; robotics engineer building perception, agents, and learning</text>
    <text x="58" y="222">systems that compound over time.</text>
  </g>

  <text x="58" y="264" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#71717a" letter-spacing="3">ROBOTICS · PERCEPTION · VOICE · AGENTS · MEMORY</text>
</svg>
